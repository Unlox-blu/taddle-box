# Production nginx config for the Taddle backend.
#
# Deployed at /etc/nginx/conf.d/server.conf on the EC2 instance
# (server.taddlebox.com). The Node app listens on 127.0.0.1:1999 (see
# ecosystem.config.js / .env — PM2 injects PORT, so both must match).
# Keep ports 80/443 open in the AWS security group; 1999 must stay closed
# to the internet (nginx is the only thing allowed to reach it).

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name server.taddlebox.com;
    return 301 https://$host$request_uri;
}

# HTTPS API server
server {
    listen 443 ssl;
    http2 on;
    server_name server.taddlebox.com;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/server.taddlebox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.taddlebox.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options           DENY             always;
    add_header X-Content-Type-Options    nosniff          always;
    add_header X-XSS-Protection          "1; mode=block"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

    # Request limits — the app allows up to 500 MB video uploads, so nginx's
    # 1M default would reject them.
    client_max_body_size 600M;

    # Gzip compression
    gzip            on;
    gzip_comp_level 5;
    gzip_types      application/json text/plain application/javascript;

    # Socket.io WebSocket upgrade — covers the /game-engine namespace too
    # (same /socket.io/ path). No ip_hash needed: PM2 cluster mode shares a
    # single port, so nginx talks to one upstream.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:1999;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 75s;
    }

    # API proxy
    location / {
        proxy_pass         http://127.0.0.1:1999;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

# Catch-all — blocks direct-IP / unknown-Host access so the API is ONLY
# reachable via https://server.taddlebox.com. nginx routes any request whose
# Host header doesn't match a named server block to the default_server; this
# block drops those connections (444). Swap to `return 403;` if a visible
# error is preferred over a silent reset.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/server.taddlebox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.taddlebox.com/privkey.pem;

    return 444;
}
