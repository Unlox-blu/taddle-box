<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - taddle box</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0f0f0f;
      font-family: Arial, Helvetica, sans-serif;
      color: #e5e7eb;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #1a1a2e;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2d2d4d;
    }

    .header {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      padding: 40px 30px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .header h1 {
      color: white;
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin-top: 10px;
      color: rgba(255,255,255,.85);
      font-size: 15px;
    }

    .content {
      padding: 40px 30px;
    }

    .content p {
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .success-box {
      background: rgba(34, 197, 94, .12);
      border-left: 4px solid #22c55e;
      padding: 16px;
      border-radius: 8px;
      margin: 24px 0;
      color: #86efac;
    }

    .details {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 18px;
      margin-top: 24px;
    }

    .details h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #fff;
      font-size: 16px;
    }

    .details p {
      margin: 8px 0;
      font-size: 14px;
    }

    .button-wrapper {
      text-align: center;
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 32px;
      background: #22c55e;
      color: #fff !important;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .footer {
      background: #111;
      text-align: center;
      padding: 24px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="icon">🎉</div>
      <h1>{{title}}</h1>
    </div>

    <div class="content">

      <p>Hi <strong>{{name}}</strong>,</p>

      <div class="success-box">
        ✅ {{successMessage}}
      </div>

    </div>

    <div class="footer">
      <p>
        This is an automated notification from taddle box.
      </p>

      <p>
        © 2026 taddle box. All rights reserved.
      </p>
    </div>

  </div>

</body>

</html>
